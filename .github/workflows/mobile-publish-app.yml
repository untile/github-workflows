name: Build and Deploy (TestFlight and/or Firebase)

on:
  workflow_call:
    inputs:
      environment:
        description: "Build profile / environment"
        type: string
        required: true
        default: preview
      publish_to_firebase:
        description: "Publish build to Firebase App Distribution?"
        type: boolean
        required: false
        default: true
      publish_to_testflight:
        description: "Publish build to TestFlight?"
        type: boolean
        required: false
        default: true
      node_version:
        description: "Node.js version"
        type: string
        required: false
        default: "23"
      bun_version:
        description: "Bun version"
        type: string
        required: false
        default: "latest"
      firebase_groups:
        description: "Firebase testers groups list (comma-separated)"
        type: string
        required: false
        default: "internal-testers"
      release_notes:
        description: "Release notes for distribution"
        type: string
        required: false
        default: ""
    secrets:
      EXPO_TOKEN:
        required: true
      # TestFlight (only required if publish_to_testflight is true)
      APP_STORE_CONNECT_API_ISSUER_ID:
        required: false
      APP_STORE_CONNECT_API_KEY_ID:
        required: false
      APP_STORE_CONNECT_API_KEY:
        required: false
      PREVIEW_APPLE_ID:
        required: false
      PRODUCTION_APPLE_ID:
        required: false
      # Firebase (only required if publish_to_firebase is true)
      PREVIEW_FIREBASE_APP_ID_IOS:
        required: false
      PRODUCTION_FIREBASE_APP_ID_IOS:
        required: false
      PREVIEW_FIREBASE_SERVICE_ACCOUNT_JSON:
        required: false
      PRODUCTION_FIREBASE_SERVICE_ACCOUNT_JSON:
        required: false

jobs:
  build-and-distribute:
    runs-on: macOS
    timeout-minutes: 60

    env:
      NODE_ENV: production
      NODE_CONFIG_ENV: ${{ inputs.environment }}
      EAS_LOCAL_BUILD_SKIP_CLEANUP: "1"
      EAS_LOCAL_BUILD_WORKINGDIR: ${{ github.workspace }}/.eas-local
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      IPA_PATH: ${{ github.workspace }}/ios-${{ github.sha }}.ipa
      FIREBASE_APP_ID: ${{ inputs.environment == 'production' && secrets.PRODUCTION_FIREBASE_APP_ID_IOS || secrets.PREVIEW_FIREBASE_APP_ID_IOS }}
      FIREBASE_CREDENTIALS: ${{ inputs.environment == 'production' && secrets.PRODUCTION_FIREBASE_SERVICE_ACCOUNT_JSON || secrets.PREVIEW_FIREBASE_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: 📝 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Clear conflicting envs
        run: |
          unset GOOGLE_APPLICATION_CREDENTIALS || true
          unset WORKLOAD_IDENTITY_PROVIDER || true
          unset GCP_WORKLOAD_IDENTITY_PROVIDER || true
          unset GOOGLE_GHA_CREDS_PATH || true

      - name: 🔍 Preflight Firebase credentials
        if: ${{ inputs.publish_to_firebase }}
        run: |
          if [ -z "${FIREBASE_CREDENTIALS}" ]; then
            echo "❌ FIREBASE_CREDENTIALS is empty. Check secrets and access."
            exit 1
          fi
          echo "Cred length: $(printf %s "${FIREBASE_CREDENTIALS}" | wc -c)"

      - name: 🧹 Clean EAS & build caches
        if: always()
        run: |
          echo "🧹 Cleaning previous EAS build caches and artefacts..."
          rm -rf ~/.eas/build
          rm -rf ~/.expo
          rm -rf ~/.expo-cache
          rm -rf ~/.expo-shared
          rm -rf .expo
          rm -rf .expo-shared
          rm -rf node_modules/.cache
          rm -rf ios/build
          rm -rf android/app/build

          echo "🧹 Cleaning Xcode DerivedData and caches..."
          rm -rf ~/Library/Developer/Xcode/DerivedData
          rm -rf ~/Library/Caches/com.apple.dt.Xcode

          echo "✅ EAS & build caches cleaned!"

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: 🏗 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: 📦 Install dependencies
        run: bun install

      - name: 📦 Install EAS CLI
        run: bun install -g eas-cli@16.20.1

      - name: 🧹 Clean env files
        run: |
          rm -f .env .env.local

      - name: 🏗 Load vars and Build (Expo EAS iOS)
        env:
          EXPO_PUBLIC_ENV: ${{ inputs.environment }}
        run: |
          eas env:pull --environment=${{ inputs.environment }} --force

          rm -rf .env.${{ inputs.environment }}
          cp .env.local .env
          cp .env.local .env.${{ inputs.environment }}

          # Export all variables to GITHUB_ENV so they persist across steps
          while IFS='=' read -r key value; do
            # Skip empty lines and comments
            [[ -z "$key" || "$key" =~ ^#.* ]] && continue
            # Remove quotes from value if present
            value=$(echo "$value" | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
            # Export to GitHub environment
            echo "$key=$value" >> $GITHUB_ENV
            # Also export for current shell
            export "$key=$value"
          done < .env.local

          set -a && source .env.local && set +a

          printenv | grep EXPO || echo "No EXPO variables found"
          echo "Environment: ${EXPO_PUBLIC_ENV:-not set}"

          if [ -z "${EXPO_PUBLIC_ENV}" ]; then
            echo "❌ EXPO_PUBLIC_ENV is not set!"
            exit 1
          fi

          if [ "${EXPO_PUBLIC_ENV}" != "${{ inputs.environment }}" ]; then
            echo "❌ EXPO_PUBLIC_ENV mismatch! Expected: ${{ inputs.environment }}, Got: ${EXPO_PUBLIC_ENV}"
            exit 1
          fi

          echo "✅ Environment validated: ${EXPO_PUBLIC_ENV}"

          printenv | grep EXPO
          echo "NODE_CONFIG_ENV: $NODE_CONFIG_ENV"
          echo "Environment: $EXPO_PUBLIC_ENV"

          EAS_NO_XCPRETTY=1 eas build --platform ios \
            --profile ${{ inputs.environment }} \
            --local --non-interactive \
            --clear-cache \
            --output "${IPA_PATH}"

      # ---------- TestFlight ----------
      - name: 🚀 Upload to TestFlight
        if: ${{ inputs.publish_to_testflight }}
        run: |
          echo "📤 Uploading IPA to TestFlight via xcrun altool..."
          echo "IPA Path: ${IPA_PATH}"

          if [ ! -f "${IPA_PATH}" ]; then
            echo "❌ IPA file not found at: ${IPA_PATH}"
            exit 1
          fi

          # Create the private_keys directory in the expected location
          PRIVATE_KEYS_DIR="${HOME}/private_keys"
          mkdir -p "${PRIVATE_KEYS_DIR}"

          # Create the .p8 file with the API key
          API_KEY_FILE="${PRIVATE_KEYS_DIR}/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8"
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY }}" > "${API_KEY_FILE}"

          # Determine which Apple ID to use based on environment
          if [ "${{ inputs.environment }}" = "production" ]; then
            APPLE_ID="${{ secrets.PRODUCTION_APPLE_ID }}"
          else
            APPLE_ID="${{ secrets.PREVIEW_APPLE_ID }}"
          fi

          echo "Created API key file at: ${API_KEY_FILE}"
          echo "Using API Key ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}"
          echo "Using Issuer ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}"
          echo "Using Apple ID: ${APPLE_ID}"

          # Upload using xcrun altool with explicit Apple ID
          xcrun altool --upload-app \
            --type ios \
            --file "${IPA_PATH}" \
            --apple-id "${APPLE_ID}" \
            --apiKey "${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}" \
            --verbose

          UPLOAD_EXIT_CODE=$?

          # Cleanup API key file and directory
          rm -f "${API_KEY_FILE}"
          rmdir "${PRIVATE_KEYS_DIR}" 2>/dev/null || true

          if [ ${UPLOAD_EXIT_CODE} -ne 0 ]; then
            echo "❌ Upload to TestFlight failed with exit code ${UPLOAD_EXIT_CODE}"
            exit ${UPLOAD_EXIT_CODE}
          fi

          echo "✅ Successfully uploaded to TestFlight!"

      # ---------- Firebase ----------
      - name: 🔐 Google Auth (Service Account via FIREBASE_CREDENTIALS)
        if: ${{ inputs.publish_to_firebase }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.FIREBASE_CREDENTIALS }}
          create_credentials_file: true

      - name: 🔎 Read project_id from FIREBASE_CREDENTIALS
        if: ${{ inputs.publish_to_firebase }}
        run: |
          node -e "const j=JSON.parse(process.env.FIREBASE_CREDENTIALS); console.log('FIREBASE_PROJECT_ID='+j.project_id)" >> $GITHUB_ENV

      - name: 📤 Distribute to Firebase App Distribution
        if: ${{ inputs.publish_to_firebase }}
        run: |
          firebase --version >/dev/null 2>&1 || npm i -g firebase-tools
          firebase appdistribution:distribute "${IPA_PATH}" \
            --app "${FIREBASE_APP_ID}" \
            --project "${FIREBASE_PROJECT_ID}" \
            --groups "${{ inputs.firebase_groups }}" \
            --release-notes "${{ inputs.release_notes }}"
